<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="config.js"></script>
</head>
<body>
<title>AI Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&display=swap">
<style>
/* Layout: a sticky lab bar with XP, a mission map of cards, and one mission "bench" at a time. */
:root{
  --bg:#F4F5FB; --surface:#FFFFFF; --ink:#1E1B3A; --muted:#58547C; --line:#E3E1F2; --chip:#EDEEF8;
  --coral:#FF6B4A; --coral-ink:#C2410C; --sun:#FFC93C; --deep:#1E1B3A; --deep-ink:#F6F7FB; --deep-muted:#C9C6E8;
  --good:#15803D; --good-bg:#DCFCE7; --bad:#B42318; --bad-bg:#FEE4E2; --warn-bg:#FFF4D6;
  --display:'Fredoka', 'Trebuchet MS', Arial, sans-serif;
  --body:'Nunito Sans', 'Segoe UI', Arial, sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#13112A; --surface:#1E1B3A; --ink:#F6F7FB; --muted:#B9B5DA; --line:#312C5C; --chip:#29254D;
  --coral:#FF7A5C; --coral-ink:#FF9C82; --sun:#FFC93C; --deep:#2C2852; --deep-ink:#F6F7FB; --deep-muted:#C9C6E8;
  --good:#4ADE80; --good-bg:#14361F; --bad:#F97066; --bad-bg:#3D1717; --warn-bg:#3A3015; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#13112A; --surface:#1E1B3A; --ink:#F6F7FB; --muted:#B9B5DA; --line:#312C5C; --chip:#29254D;
  --coral:#FF7A5C; --coral-ink:#FF9C82; --sun:#FFC93C; --deep:#2C2852; --deep-ink:#F6F7FB; --deep-muted:#C9C6E8;
  --good:#4ADE80; --good-bg:#14361F; --bad:#F97066; --bad-bg:#3D1717; --warn-bg:#3A3015; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px;border-radius:8px}
.gut{padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:700;font-size:22px;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:8px}
.logo b{background:var(--coral);color:#fff;border-radius:10px;padding:0 8px;font-weight:700}
.who{margin-left:auto;display:flex;align-items:center;gap:12px;min-width:0}
.lvl{font-family:var(--display);font-weight:600;font-size:14px;background:var(--chip);border-radius:999px;padding:4px 12px;white-space:nowrap}
.xpbar{width:150px;height:10px;border-radius:99px;background:var(--chip);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),var(--sun));border-radius:99px;transition:width .5s}
.xpn{font-variant-numeric:tabular-nums;font-weight:800;font-size:14px;white-space:nowrap}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 20px;font-weight:800;cursor:pointer;background:var(--coral);color:#fff;text-decoration:none;box-shadow:0 4px 0 var(--coral-ink);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--coral-ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.alt{background:var(--surface);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.sun{background:var(--sun);color:#1E1B3A;box-shadow:0 4px 0 #C99512}
.btn.sm{padding:8px 14px;border-radius:12px;font-size:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* home */
main{padding-block:28px 64px}
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:stretch;margin-bottom:28px}
.hero>*,.two>*,.bins>*,.charset>*{min-width:0}
.hero-main{background:var(--deep);color:var(--deep-ink);border-radius:28px;padding:32px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero-main h1{font-size:clamp(34px,6vw,56px);font-weight:700}
.hero-main h1 span{color:var(--sun)}
.hero-main p{color:var(--deep-muted);max-width:46ch}
.hero-main .net{position:absolute;right:-30px;bottom:-30px;width:220px;opacity:.25}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.side{display:flex;flex-direction:column;gap:12px}
.name-in{display:flex;gap:8px}
.name-in input{flex:1;min-width:0;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)}
.lic{display:flex;flex-direction:column;gap:8px}
.lic .bar{height:12px;border-radius:99px;background:var(--chip);overflow:hidden}
.lic .bar i{display:block;height:100%;background:var(--good)}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--coral-ink)}
.small{font-size:14px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.mcard{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;transition:transform .12s, box-shadow .12s;min-width:0}
.mcard:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(30,27,58,.10)}
.mcard .num{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;color:var(--coral)}
.mcard h3{font-size:21px}
.mcard p{font-size:14px;color:var(--muted)}
.mcard .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;background:var(--chip);white-space:nowrap}
.pill.done{background:var(--good-bg);color:var(--good)}
.pill.new{background:var(--warn-bg)}
.cloud{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}.cloud.warn{color:var(--bad)}
.login{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:stretch;margin-top:24px}
.login .card{padding:24px}
@media (max-width:760px){.login{grid-template-columns:1fr}}
.logincards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:10px}
.lcard{border:2px dashed var(--line);border-radius:14px;padding:12px;background:var(--surface);break-inside:avoid}
.lcard p{margin:2px 0}
.hubt td,.hubt th{padding:6px 6px;font-size:13px;white-space:nowrap;text-transform:none;letter-spacing:0}
.hubt td.ok{background:var(--good-bg);color:var(--good);font-weight:800;text-align:center}
.hubt td.part{background:var(--warn-bg);text-align:center}
@media print{body *{visibility:hidden}.printme,.printme *{visibility:visible}.printme{position:absolute;left:0;top:0;width:100%}.lcard{border:1px dashed #000;color:#000;background:#fff}}
.mystery{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:10px}
.mcard{border:2px solid var(--line);border-radius:16px;padding:10px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.mcard .fb{margin-top:6px}
.mcard th,.mcard td{padding:5px 4px;font-size:12px;letter-spacing:0;text-transform:none;white-space:nowrap}
.mcard .tbl{overflow-x:auto}
.panel.deep .pill:not(.done){background:rgba(255,255,255,.14);color:#F6F7FB}
.mcard.isdone{border-color:var(--good)}

/* mission */
.mhead{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.back{color:var(--muted);text-decoration:none;font-weight:800;font-size:14px}
.mhead h1{font-size:clamp(30px,5vw,44px)}
.goal{max-width:62ch;color:var(--muted);font-size:17px}
.stage{display:flex;flex-direction:column;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel.deep{background:var(--deep);color:var(--deep-ink);border-color:transparent}
.panel.deep .small{color:var(--deep-muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.big{font-family:var(--display);font-weight:600;font-size:clamp(24px,4vw,34px);line-height:1.25;text-wrap:balance}
.fb{border-radius:14px;padding:14px 16px;font-weight:600}
.fb.ok{background:var(--good-bg);color:var(--good)}
.fb.no{background:var(--bad-bg);color:var(--bad)}
.fb.info{background:var(--warn-bg)}
.fb span{color:var(--ink);font-weight:400;display:block;margin-top:4px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--chip)}
.dots i.ok{background:var(--good)} .dots i.no{background:var(--bad)} .dots i.now{background:var(--coral)}
.score{font-family:var(--display);font-weight:700;font-size:64px;line-height:1;color:var(--coral)}
textarea,.field{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--bg);resize:vertical}
select.field{padding:10px 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

/* mini chatgpt */
.counts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.crow{background:var(--bg);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.crow b{font-family:var(--display);font-weight:600}
.nx{display:flex;align-items:center;gap:8px;font-size:14px}
.nx .b{height:8px;border-radius:9px;background:var(--coral)}
.gen{font-family:var(--display);font-size:clamp(24px,4vw,34px);font-weight:600;min-height:1.3em;display:flex;flex-wrap:wrap;gap:6px 10px}
.gen span{animation:pop .3s ease}
.why{font-size:14px;color:var(--muted);min-height:1.5em}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

/* fruit lab */
.pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.fruit{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-size:12px;font-weight:700}
.fruit .e{font-size:34px;line-height:1.1}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bin{border:2px dashed var(--line);border-radius:18px;padding:14px;min-height:110px;display:flex;flex-direction:column;gap:8px}
.bin.sel{border-color:var(--coral);border-style:solid}
.bin .items{display:flex;flex-wrap:wrap;gap:6px}
.bin .items button{font-size:28px;border:0;background:var(--bg);border-radius:12px;padding:2px 6px;cursor:pointer}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.res{border-radius:14px;padding:10px;display:flex;align-items:center;gap:10px;background:var(--bg)}
.res .e{font-size:32px}
.res.ok{background:var(--good-bg)} .res.no{background:var(--bad-bg)}
.res small{display:block;font-size:12px;color:var(--muted)}
.matrix{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px;max-width:520px}
.matrix div{border-radius:12px;padding:12px;text-align:center;font-weight:800}
.matrix .h{background:transparent;font-size:13px;color:var(--muted)}
.matrix .v{font-family:var(--display);font-size:34px}
.matrix .g{background:var(--good-bg);color:var(--good)} .matrix .r{background:var(--bad-bg);color:var(--bad)}

/* dishes */
.dishes{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.dish{border:2px solid var(--line);border-radius:14px;padding:10px;background:var(--surface);font-weight:700;cursor:pointer;text-align:left;transition:opacity .25s}
.dish.out{opacity:.25;text-decoration:line-through;cursor:default}
.qs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.q{border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px}
.q .split{display:flex;height:8px;border-radius:9px;overflow:hidden;background:var(--chip)}
.q .split i{background:var(--coral)}
.q .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.q[disabled]{opacity:.4;cursor:default}
.path{display:flex;flex-wrap:wrap;gap:6px}
.path span{background:var(--chip);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700}

.treewrap{display:inline-block;min-width:100%;padding:6px}
.tnode{display:flex;flex-direction:column;align-items:center;gap:8px}
.tq{background:var(--deep);color:var(--deep-ink);border-radius:12px;padding:8px 14px;font-weight:800;text-align:center;max-width:220px}
.tbr{display:flex;gap:14px;align-items:flex-start}
.tbr>div{display:flex;flex-direction:column;align-items:center;gap:6px;border-top:3px solid var(--line);padding-top:6px}
.tlab{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase}
.tleaf{background:var(--good-bg);color:var(--good);border-radius:12px;padding:8px 12px;font-weight:800;white-space:nowrap}
.tleaf.stuck{background:var(--bad-bg);color:var(--bad);white-space:normal;max-width:200px}
.learn{background:var(--warn-bg);border-radius:18px;padding:16px 20px;margin-bottom:18px;display:flex;flex-direction:column;gap:4px}
.learn p{font-family:var(--display);font-weight:600;font-size:clamp(18px,2.6vw,22px);line-height:1.3}
.create{border:2px dashed var(--coral);margin-top:18px}
.painter{width:100%;max-width:640px;height:auto;border-radius:16px;display:block;background:#E8F6FF}
.panel.deep .painter + .small{color:var(--deep-muted)}
.sketch img{width:100%;max-width:480px;border-radius:14px;background:#fff;display:block}
/* neuron */
.net svg{width:100%;height:auto;max-width:620px}
.days td button{white-space:nowrap}
.wctl{display:flex;gap:14px;flex-wrap:wrap}
.wctl div{display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:var(--bg);border-radius:12px;padding:6px 10px;font-weight:700}
.wctl button{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-weight:800}

/* prompt */
.ing{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ing div{border-radius:12px;padding:10px;background:var(--chip);font-weight:800;font-size:14px;text-align:center}
.ing div.on{background:var(--good-bg);color:var(--good)}
.answer{white-space:pre-wrap;background:var(--bg);border-radius:14px;padding:14px;min-height:60px}
.log{display:flex;flex-direction:column;gap:6px}
.log div{display:flex;gap:10px;font-size:14px;background:var(--bg);border-radius:10px;padding:8px 10px}
.log b{white-space:nowrap}
.preview{font-family:var(--display);font-size:clamp(20px,3vw,26px);font-weight:500;line-height:1.35}
.meter{display:flex;gap:4px}
.meter i{flex:1;height:10px;border-radius:9px;background:var(--chip)}
.meter i.on{background:var(--coral)}
.ingrow{display:flex;flex-direction:column;gap:8px}
.ingrow label{font-weight:800}

/* voice */
.line{display:grid;grid-template-columns:110px 1fr auto auto;gap:8px;align-items:center}
.line.now input{border-color:var(--coral)}
.charset{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* detective */
.sent{display:flex;flex-direction:column;gap:8px}
.sent button{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;cursor:pointer;font-size:16px}
.sent button[aria-pressed="true"]{border-color:var(--bad);background:var(--bad-bg)}
.sent button.t{border-color:var(--good)}
.sent button small{display:block;margin-top:4px;font-weight:700}

/* licence */
.cert{border:3px solid var(--ink);border-radius:28px;padding:32px;display:flex;flex-direction:column;gap:14px;background:var(--surface);position:relative}
.cert h2{font-size:clamp(30px,5vw,46px)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{border-radius:14px;padding:12px;background:var(--chip);font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px}
.badge.on{background:var(--good-bg);color:var(--good)}
.badge i{font-style:normal;font-family:var(--display);font-size:20px}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(30px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:14px;font-weight:800;opacity:0;transition:.3s;pointer-events:none;z-index:20;max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translateX(-50%)}

@media (max-width:760px){
  .hero,.two,.bins,.charset{grid-template-columns:1fr}
  .ing{grid-template-columns:1fr 1fr}
  .xpbar{width:90px}
  .line{grid-template-columns:1fr;}
}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>

<header class="top gut">
  <div class="wrap">
    <a class="logo" href="#"><b>AI</b> Lab</a>
    <div class="who">
      <span class="lvl" id="lvl">Rookie</span>
      <div class="xpbar" aria-hidden="true"><i id="xpfill" style="width:0"></i></div>
      <span class="xpn" id="xpn">0 XP</span>
    </div>
  </div>
</header>
<main class="gut"><div class="wrap" id="app"></div></main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
/* ---------- state ---------- */
/* CLOUD: paste your Supabase Project URL and "anon public" key here to turn on student accounts.
   Leave them empty and the lab works on this computer only, with no login. */
const CLOUD = window.EVG_CLOUD || {url:"", key:""};
const cloudOn = () => !!(CLOUD.url && CLOUD.key);
const SESS_KEY = "ai-lab-session";
let ACC = null; try { ACC = cloudOn() ? JSON.parse(localStorage.getItem(SESS_KEY) || "null") : null; } catch(e) {}
let KEY = ACC ? "ai-lab-v1:" + ACC.username : "ai-lab-v1";
const blankState = () => ({name:"", best:{}, done:{}, prompts:[], create:{}, fruits:[], _t:0});
function normalize(d){ const s = Object.assign(blankState(), d && typeof d === "object" ? d : {});
  ["best","done","create"].forEach(k => { if (!s[k] || typeof s[k] !== "object" || Array.isArray(s[k])) s[k] = {}; });
  ["prompts","fruits"].forEach(k => { if (!Array.isArray(s[k])) s[k] = []; }); return s; }
let S = blankState();
try { const r = localStorage.getItem(KEY); if (r) S = normalize(JSON.parse(r)); } catch(e) {}
function save(){ S._t = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} if (cloudOn() && ACC) queueCloud(); }

async function rpc(fn, args, keepalive){
  let r;
  try { r = await fetch(CLOUD.url.replace(/\/+$/,"") + "/rest/v1/rpc/" + fn, {method:"POST", keepalive: !!keepalive,
    headers: Object.assign({"apikey":CLOUD.key, "Content-Type":"application/json"}, /^eyJ/.test(CLOUD.key) ? {"Authorization":"Bearer " + CLOUD.key} : {}), body: JSON.stringify(args || {})}); }
  catch(e){ throw {code:"offline"}; }
  const t = await r.text(); let j = null; try { j = t ? JSON.parse(t) : null; } catch(e) {}
  if (!r.ok) throw {code: (j && j.message) || ("http_" + r.status)};
  return j;
}
let cloudT = null, dirty = false;
function setCloud(st){
  const el = document.getElementById("cloud"); if (!el) return;
  const T = {saving:["☁ Saving…",""], saved:["☁ Saved",""], offline:["☁ Offline: will save later","warn"], expired:["☁ Please log in again","warn"]}[st] || ["",""];

/* ---------- reliable speech (works around Chrome's cancel-then-speak bug) ---------- */
const SPEAK = {keep:[]};
function speakNow(utts, onFail){
  const synth = window.speechSynthesis;
  if (!synth || typeof SpeechSynthesisUtterance === "undefined"){ if (onFail) onFail("unsupported"); return; }
  const list = Array.isArray(utts) ? utts : [utts]; SPEAK.keep = list; let started = false, failed = false;
  const fail = code => { if (failed) return; failed = true; if (onFail) onFail(code); };
  list.forEach(u => { const os = u.onstart, oe = u.onerror;
    u.onstart = e => { started = true; if (os) os(e); };
    u.onerror = e => { const c = e && e.error; if (c !== "interrupted" && c !== "canceled") fail(c || "error"); if (oe) oe(e); }; });
  const go = () => { try { synth.resume(); } catch(e){} list.forEach(u => synth.speak(u)); };
  if (synth.speaking || synth.pending){ synth.cancel(); setTimeout(go, 150); } else go();
  setTimeout(() => { if (!started && !(list[0] && list[0].volume === 0)) fail("silent"); }, 3000);
}
function noSound(code){

  const add = t => { log.push(t); show(); };
  try { const AC = window.AudioContext || window.webkitAudioContext; const ac = new AC(); const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 660; g.gain.value = 0.15; o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.35); add("1. Beep: played (state " + ac.state + "). Did you hear a beep?"); }
  catch(e){ add("1. Beep: failed (" + (e && e.name) + ")"); }
  const synth = window.speechSynthesis;
  if (!synth || typeof SpeechSynthesisUtterance === "undefined"){ add("2. Speech: NOT supported in this browser"); return; }
  let vs = []; try { vs = synth.getVoices(); } catch(e){}
  add("2. Speech: supported · " + vs.length + " voices" + (vs.length ? " (" + vs.slice(0,3).map(v => v.name + (v.localService ? "" : " [online]")).join(", ") + ")" : ""));

  }, 500);

  const t = d.toLowerCase(), cnt = re => (t.match(re) || []).length;

  const high = cnt(/\b(tiny|small|little|squeak\w*|mouse|baby|kid|child|high|chipmunk|bird|kitten|fairy|cheerful)\b/g);

  apple:{e:"🍎",n:"red apple",color:"red",shape:"round",size:"medium",y:true},
  gapple:{e:"🍏",n:"green apple",color:"green",shape:"round",size:"medium",y:true},
  cherry:{e:"🍒",n:"cherries",color:"red",shape:"round",size:"small",y:false},
  straw:{e:"🍓",n:"strawberry",color:"red",shape:"heart",size:"small",y:false},
  pear:{e:"🍐",n:"pear",color:"green",shape:"pear",size:"medium",y:false},
  kiwi:{e:"🥝",n:"kiwi",color:"green",shape:"round",size:"small",y:false},
  melon:{e:"🍈",n:"melon",color:"green",shape:"round",size:"large",y:false},
  orange:{e:"🍊",n:"orange",color:"orange",shape:"round",size:"medium",y:false},
  lemon:{e:"🍋",n:"lemon",color:"yellow",shape:"oval",size:"medium",y:false},
  banana:{e:"🍌",n:"banana",color:"yellow",shape:"long",size:"medium",y:false},

const CLUES = ["color","shape","size"];

function compare(a,b){ return CLUES.map(c => a[c] === b[c]); }

  const scored = train.map(t => { const ok = compare(it, F[t.k]); return {t, ok, m: ok.filter(Boolean).length}; });
  const best = Math.max(...scored.map(s=>s.m));

  const y = yes === no ? null : yes > no;
  const conf = y === null ? 50 : Math.round(best/3*100 * Math.max(yes,no)/top.length);

}

const VT = (() => {

      const chunks = [], rec = new MediaRecorder(st); const a = ctx();

        try { st.getTracks().forEach(t => t.stop()); } catch(e){} stream = null;

    const d = b.getChannelData(0), sr = b.sampleRate, win = Math.floor(sr*0.02); let peak = 0;
    for (let i=0;i<d.length;i++) peak = Math.max(peak, Math.abs(d[i]));

    e.preventDefault(); err.replaceChildren(); if (!u.value.trim() || !p.value){ err.replaceChildren(h("div", {class:"fb no"}, "Type your username and password.")); return; }
    btn.disabled = true; btn.textContent = "Opening your lab…";
    try { const r = await rpc("ailab_student_login", {p_user:u.value.trim(), p_pass:p.value}); startSession(r); renderTop(); location.hash = ""; route(); toast("Hi " + ACC.name + "! Your progress is saved online."); }
    catch(e2){ err.replaceChildren(h("div", {class:"fb no"}, LOGIN_ERR(e2.code))); btn.disabled = false; btn.textContent = "Let's go!"; }
  }}, h("label", {for:"lu", class:"eyebrow"}, "Username"), u, h("label", {for:"lp", class:"eyebrow"}, "Password"), p, btn, err);
  app.replaceChildren(h("section", {class:"login"},
    h("div", {class:"hero-main", style:"border-radius:24px;padding:28px"}, h("p", {class:"eyebrow", style:"color:var(--sun)"}, "Think · Train · Test"), h("h1", null, "The ", h("span", null, "AI Lab")), h("p", null, "Log in with the card your teacher gave you."), netArt()),
    h("div", {class:"card"}, form, h("p", {class:"small", style:"margin-top:14px"}, "Forgot your password? Ask your teacher for a new one."), h("a", {class:"small", href:"#teacher"}, "I'm the teacher →"))));

const TKEY = "ai-lab-teacher";
const WORDS = ["cedar","rocket","mango","tiger","comet","pixel","robot","panda","lemon","falcon","orbit","cactus","olive","planet","dolphin","koala","maple","star"];
const rnd = n => Math.floor(Math.random()*n);
function slugName(name){ const f = (name.trim().split(/\s+/)[0] || "").toLowerCase().normalize("NFD").replace(/[^a-z]/g, "").slice(0,10); return f || "student"; }
function renderTeacher(){
  if (!cloudOn()){ app.replaceChildren(h("section", {class:"panel"}, h("p", {class:"eyebrow"}, "Teacher hub"), h("h2", null, "Student accounts are not switched on yet"), h("p", null, "Ask your tech person to connect the AI Lab to its Supabase database (see the setup guide)."), h("a", {class:"btn sm alt", href:"#"}, "← Back"))); return; }
  let tok = null; try { tok = sessionStorage.getItem(TKEY); } catch(e) {}
  if (tok) return teacherHub(tok);
  const box = h("div", null, h("p", {class:"small"}, "Checking…"));
  app.replaceChildren(h("section", {class:"panel", style:"max-width:520px;margin:0 auto"}, h("p", {class:"eyebrow"}, "Teacher hub"), box));
  rpc("ailab_has_teacher", {}).then(has => {
    const u = h("input", {class:"field", autocomplete:"username", autocapitalize:"none", "aria-label":"Teacher username", placeholder:"Teacher username"});
    const p = h("input", {class:"field", type:"password", autocomplete: has ? "current-password" : "new-password", "aria-label":"Teacher password", placeholder: has ? "Password" : "Choose a password (6+ characters)"});
    const err = h("div"), btn = h("button", {class:"btn", type:"submit"}, has ? "Log in" : "Create the teacher account");
    box.replaceChildren(h("h2", null, has ? "Teacher log in" : "First time: create the teacher account"),
      ...(has ? [] : [h("p", {class:"small"}, "This happens only once. Keep this password safe: it controls all student accounts.")]),
      h("form", {class:"stage", style:"gap:10px", onsubmit: async e => { e.preventDefault(); err.replaceChildren(); btn.disabled = true;
        try { const t = await rpc(has ? "ailab_teacher_login" : "ailab_setup_teacher", {p_user:u.value.trim(), p_pass:p.value}); try { sessionStorage.setItem(TKEY, t); } catch(x) {} teacherHub(t); }
        catch(e2){ err.replaceChildren(h("div", {class:"fb no"}, LOGIN_ERR(e2.code))); btn.disabled = false; } }}, u, p, btn, err),
      h("a", {class:"small", href:"#"}, "← Back to the lab"));
  }).catch(e => box.replaceChildren(h("div", {class:"fb no"}, LOGIN_ERR(e.code))));
}
function teacherHub(tok){
  let list = [], filter = "", cards = [];
  const out = h("div"), addOut = h("div"), msg = h("div");
  const fail = e => { if (e.code === "not_teacher"){ try { sessionStorage.removeItem(TKEY); } catch(x) {} renderTeacher(); toast(LOGIN_ERR(e.code)); } else msg.replaceChildren(h("div", {class:"fb no"}, LOGIN_ERR(e.code))); };
  async function load(){ try { list = await rpc("ailab_list_students", {p_token:tok}) || []; draw(); } catch(e){ fail(e); } }
  const cls = h("input", {class:"field", placeholder:"Class, e.g. EB7 A", "aria-label":"Class name"});
  const names = h("textarea", {rows:"6", placeholder:"One student per line, first name + last name\nGhadi Hamadeh\nSara Khoury", "aria-label":"Student names"});
  async function create(){
    const rows = names.value.split("\n").map(x => x.trim()).filter(Boolean).slice(0,60);
    if (!rows.length){ toast("Write the student names first."); return; }
    const taken = new Set(list.map(s => s.username)), made = [];
    rows.forEach(n => { let un; do { un = slugName(n) + String(10 + rnd(90)); } while (taken.has(un)); taken.add(un);
      made.push({name:n.slice(0,40), username:un, class:cls.value.trim().slice(0,20), password: WORDS[rnd(WORDS.length)] + "-" + String(10 + rnd(90))}); });
    try { await rpc("ailab_add_students", {p_token:tok, p_rows:made}); cards = made; names.value = ""; drawCards(); load(); toast(made.length + " accounts created"); }
    catch(e){ fail(e); }
  }
  function drawCards(){
    const url = location.href.split("#")[0];
    addOut.replaceChildren(!cards.length ? "" : h("div", {class:"panel", style:"margin-top:14px"},
      h("div", {class:"row", style:"justify-content:space-between"}, h("h3", null, "Login cards (" + cards.length + ")"), h("button", {class:"btn sm", onclick:()=>window.print()}, "🖨 Print the cards")),
      h("p", {class:"small"}, "Print or copy them now: passwords are stored locked and can't be shown again. You can always give a student a new password."),
      h("div", {class:"logincards printme"}, ...cards.map(c => h("div", {class:"lcard"},
        h("p", {class:"eyebrow"}, "AI Lab · " + (c.class || "")), h("p", {style:"font-weight:800;font-size:18px;margin:4px 0"}, c.name),
        h("p", null, "Username: ", h("b", null, c.username)), h("p", null, "Password: ", h("b", null, c.password)), h("p", {class:"small", style:"overflow-wrap:anywhere"}, url))))));
  }
  function confirmBtn(label, sure, fn){ let armed = false; const b = h("button", {class:"btn sm alt", onclick:()=>{ if (!armed){ armed = true; b.textContent = sure; setTimeout(()=>{ armed = false; b.textContent = label; }, 3000); } else fn(); }}, label); return b; }
  function draw(){
    const classes = [...new Set(list.map(s => s.class_name || ""))].sort();
    const shown = list.filter(s => !filter || s.class_name === filter);
    const sel = h("select", {class:"field", style:"max-width:220px", "aria-label":"Filter by class"}, h("option", {value:""}, "All classes"), ...classes.map(c => h("option", {value:c, selected:c===filter}, c || "(no class)")));
    sel.addEventListener("change", ()=>{ filter = sel.value; draw(); });
    const xpOf = s => Object.values((s.data && s.data.best) || {}).reduce((a,b)=>a+(+b||0), 0);
    const ago = t => { if (!t) return "never"; const d = (Date.now() - new Date(t))/60000; return d < 60 ? Math.round(d) + " min ago" : d < 1440 ? Math.round(d/60) + " h ago" : Math.round(d/1440) + " days ago"; };
    out.replaceChildren(h("div", {class:"panel", style:"margin-top:14px"},
      h("div", {class:"row", style:"justify-content:space-between"}, h("h3", null, "Students (" + shown.length + ")"), h("div", {class:"row"}, sel, h("button", {class:"btn sm alt", onclick:load}, "↻ Refresh"), h("button", {class:"btn sm alt", onclick:()=>csv(shown)}, "⬇ Export CSV"))),
      !shown.length ? h("p", {class:"small"}, "No students yet. Add a class above.") :
      h("div", {class:"tbl", style:"overflow-x:auto"}, h("table", {class:"hubt"},
        h("tr", null, ...["Student","Username","XP","Level", ...MISSIONS.map((m,i)=>"M"+(i+1)), "★","Last active",""].map(t=>h("th", null, t))),
        ...shown.map(s => { const d = s.data || {}, best = d.best || {}, done = d.done || {}, x = xpOf(s);
          return h("tr", null, h("td", null, h("b", null, s.display_name), h("br"), h("span", {class:"small"}, s.class_name)), h("td", null, s.username), h("td", null, x), h("td", null, level(x)),
            ...MISSIONS.map(m => h("td", {class: done[m.id] ? "ok" : best[m.id] ? "part" : "", title:m.title}, done[m.id] ? "✓" : best[m.id] ? String(best[m.id]) : "·")),
            h("td", null, Object.keys(d.create || {}).length), h("td", {class:"small"}, ago([s.updated_at, s.last_login].filter(Boolean).sort().pop())),
            h("td", null, h("div", {class:"row", style:"flex-wrap:nowrap"},
              confirmBtn("New password", "Sure?", async () => { const pw = WORDS[rnd(WORDS.length)] + "-" + String(10 + rnd(90)); try { await rpc("ailab_reset_password", {p_token:tok, p_user:s.username, p_pass:pw}); cards = [{name:s.display_name, username:s.username, class:s.class_name, password:pw}]; drawCards(); toast("New password: " + pw); } catch(e){ fail(e); } }),
              confirmBtn("Delete", "Delete forever?", async () => { try { await rpc("ailab_delete_student", {p_token:tok, p_user:s.username}); toast("Deleted"); load(); } catch(e){ fail(e); } })))); })))));
  }
  function csv(rows){
    const head = ["name","class","username","xp","level", ...MISSIONS.map((m,i)=>"M"+(i+1)+" "+m.title), "creative_stars","last_active"];
    const q = v => '"' + String(v == null ? "" : v).replace(/"/g,'""') + '"';
    const lines = [head.map(q).join(",")].concat(rows.map(s => { const d = s.data || {}, x = Object.values(d.best || {}).reduce((a,b)=>a+(+b||0),0);
      return [s.display_name, s.class_name, s.username, x, level(x), ...MISSIONS.map(m => (d.best||{})[m.id] || 0), Object.keys(d.create||{}).length, s.updated_at || ""].map(q).join(","); }));
    const a = h("a", {href: URL.createObjectURL(new Blob(["﻿" + lines.join("\n")], {type:"text/csv"})), download:"ai-lab-progress.csv"}); document.body.append(a); a.click(); a.remove();
  }
  app.replaceChildren(
    h("div", {class:"row", style:"justify-content:space-between"}, h("div", null, h("p", {class:"eyebrow"}, "Teacher hub"), h("h1", {style:"font-size:36px"}, "My classes")),
      h("button", {class:"btn sm alt", onclick:()=>{ rpc("ailab_logout", {p_token:tok}).catch(()=>{}); try { sessionStorage.removeItem(TKEY); } catch(e) {} location.hash = ""; route(); }}, "Log out")),
    msg,
    h("div", {class:"panel"}, h("p", {class:"eyebrow"}, "Add students"), h("h3", null, "Create accounts for a class"),
      h("div", {class:"stage", style:"gap:10px"}, cls, names, h("div", {class:"row"}, h("button", {class:"btn", onclick:create}, "Create accounts"), h("span", {class:"small"}, "Usernames and passwords are made for you. No email needed.")))),
    addOut, out);
  load();
}
function route(){
  const id = (location.hash || "").slice(1);
  document.body.classList.toggle("in-hub", id === "teacher");
  const who = document.querySelector(".who"); if (who) who.style.visibility = (id === "teacher" || (cloudOn() && !ACC)) ? "hidden" : "";
  if (id === "teacher"){ renderTeacher(); window.scrollTo(0,0); return; }
  if (cloudOn() && !ACC){ renderLogin(); window.scrollTo(0,0); return; }
  if (MISSIONS.some(m=>m.id===id)) renderMission(id);
  else if (id === "licence") renderLicence();
  else renderHome();
  window.scrollTo(0,0);
}
addEventListener("hashchange", route);
(function boot(){
  const who = document.querySelector(".who");
  if (who && cloudOn()){ who.prepend(h("span", {id:"cloud", class:"cloud"})); }
  renderTop();
  if (cloudOn() && ACC && location.hash !== "#teacher"){
    app.replaceChildren(h("p", {class:"small", style:"padding:40px 0"}, "Opening your lab…"));
    rpc("ailab_load", {p_token:ACC.token}).then(r => { r.token = ACC.token; startSession(r); setCloud("saved"); renderTop(); route(); })
      .catch(e => { if (e.code === "not_logged_in"){ try { localStorage.removeItem(SESS_KEY); } catch(x) {} ACC = null; S = blankState(); renderTop(); route(); }
        else { setCloud("offline"); toast("Offline: using the copy on this computer."); route(); } });
  } else route();
})();
})();
