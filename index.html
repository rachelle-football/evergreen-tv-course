<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Creators · EB7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: a broadcast "rundown" — one segment on air at a time, channel bug + clock on top, rundown rail below */
:root{
  --paper:#F4F6F2; --panel:#FFFFFF; --ink:#13221C; --muted:#56665E; --line:#D7DFD9;
  --green:#1E7A55; --green-soft:#E3F1E9; --onair:#D9412A; --onair-soft:#FBE7E3; --gold:#B7791F; --gold-soft:#FBF0DC;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1512; --panel:#16201B; --ink:#E8F0EB; --muted:#9BB0A5; --line:#2A3832;
  --green:#4BC38B; --green-soft:#16362A; --onair:#FF6B50; --onair-soft:#3A1D17; --gold:#E9B04F; --gold-soft:#3A2C14; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1512; --panel:#16201B; --ink:#E8F0EB; --muted:#9BB0A5; --line:#2A3832;
  --green:#4BC38B; --green-soft:#16362A; --onair:#FF6B50; --onair-soft:#3A1D17; --gold:#E9B04F; --gold-soft:#3A2C14; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--green);outline-offset:3px;border-radius:6px}
h1,h2,h3{font-family:var(--display);line-height:1.08;margin:0;text-wrap:balance}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.bug{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;letter-spacing:.02em}
.bug .live{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;background:var(--onair);color:#fff;font:700 12px/1 var(--mono);letter-spacing:.12em;padding:6px 8px;border-radius:4px}
.bug .live i{width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1.6s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.bug small{font-family:var(--body);font-weight:400;color:var(--muted);letter-spacing:0}
.clock{margin-left:auto;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:15px}
.clock b{font-size:20px;font-variant-numeric:tabular-nums;min-width:4.2ch;text-align:right}
.clock b.late{color:var(--onair)}
.ghost{background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px}
.ghost:hover{border-color:var(--ink)}

/* stage */
main{padding-block:26px 120px}
.seg[hidden]{display:none!important}
.lower{display:flex;align-items:stretch;gap:0;margin-bottom:22px;max-width:100%}
.lower .no{background:var(--green);color:#fff;font:700 15px/1 var(--mono);padding:12px 14px;display:flex;align-items:center;border-radius:10px 0 0 10px}
.lower .name{background:var(--panel);border:1px solid var(--line);border-left:0;border-radius:0 10px 10px 0;padding:8px 16px;min-width:0}
.lower .name h2{font-size:clamp(26px,3.6vw,40px);font-weight:800}
.lower .name p{margin:2px 0 0;color:var(--muted);font-size:15px}
.big{font-family:var(--display);font-weight:700;font-size:clamp(24px,3vw,34px);line-height:1.2;max-width:30ch;margin:0 0 18px;text-wrap:balance}
.lead{font-size:20px;max-width:62ch;margin:0 0 20px}
.muted{color:var(--muted)}
.note{font-size:14px;color:var(--muted);margin-top:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.tag{display:inline-block;font:700 12px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.btn{background:var(--ink);color:var(--paper);border:0;border-radius:10px;padding:12px 18px;font-weight:700}
.btn:hover{opacity:.9}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
a{color:var(--green);font-weight:700}


/* chapter 2 */
.def{border:2px solid var(--green);background:var(--green-soft);border-radius:16px;padding:20px 22px;margin-top:18px}
.def p{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(22px,2.8vw,30px);line-height:1.25}
.steps3{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:12px;align-items:center}
.steps3 h3{font-size:26px;margin:6px 0}
.steps3 p{margin:0;font-size:17px}
.steps3 .arrow{font:700 28px/1 var(--mono);color:var(--muted)}
@media (max-width:820px){.steps3{grid-template-columns:1fr}.steps3 .arrow{transform:rotate(90deg);justify-self:center}}
.mission{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.mission{grid-template-columns:1fr}}
.checklist{list-style:none;padding:0;margin:0;display:grid;gap:10px;counter-reset:st}
.checklist li{counter-increment:st;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.checklist li.ok{border-color:var(--green);background:var(--green-soft)}
.checklist label{display:grid;grid-template-columns:auto auto 1fr;gap:12px;align-items:start;padding:14px 16px;cursor:pointer}
.checklist label::before{content:counter(st);font:700 15px/1 var(--mono);background:var(--ink);color:var(--paper);border-radius:6px;padding:6px 8px;grid-column:1;grid-row:1}
.checklist input{grid-column:2;grid-row:1;width:22px;height:22px;margin:2px 0 0;accent-color:var(--green)}
.checklist label>span{grid-column:3;grid-row:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.checklist b{font-family:var(--display);font-size:20px}
.checklist .how{font-size:16px;color:var(--ink)}
.checklist li.ok b{text-decoration:line-through;text-decoration-thickness:2px}
.tally{display:grid;gap:14px;position:sticky;top:84px}
.tcol{border-top:1px solid var(--line);padding-top:12px}
.tname{margin:0;font-weight:700}
.pct{font:800 clamp(40px,5vw,56px)/1 var(--display);font-variant-numeric:tabular-nums;margin:4px 0}
.done-note{margin:10px 0 0;font-weight:700;color:var(--green)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.fruits{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
.fruit{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;width:64px}
.fruit .ball{width:52px;height:52px;border-radius:50% 50% 46% 46%;display:block;box-shadow:inset -6px -6px 0 rgba(0,0,0,.15)}
.fruit .leaf{position:absolute;top:-6px;left:34px;width:14px;height:9px;background:#3E8E41;border-radius:0 80% 0 80%}
.fruit small{font-size:13px;color:var(--muted)}
#aiSays.bad{border-color:var(--onair);background:var(--onair-soft)}
#aiSays.good{border-color:var(--green);background:var(--green-soft)}
.pick{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr))}
.segcard{text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px;min-height:96px}
.segcard strong{font-family:var(--display);font-size:20px}
.segcard span{font-size:15px;color:var(--muted)}
.segcard:hover{border-color:var(--ink)}
.segcard[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft)}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;background:var(--panel);color:var(--ink);resize:vertical;margin-top:8px}
.pdiv{align-self:flex-start;font:700 11px/1 var(--mono);color:var(--muted);padding:10px 2px 0;border-top:4px solid transparent}

/* chapter 3 */
.prompt{white-space:pre-wrap;font:15px/1.55 var(--mono);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0 12px;overflow-x:auto}
.quote{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.3;margin:10px 0 10px}
.card.bad{border-color:var(--onair);background:var(--onair-soft)}
.card.good{border-color:var(--green);background:var(--green-soft)}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.part{display:flex;flex-direction:column;gap:4px}
.part b{font-family:var(--display);font-size:22px}
.part span{color:var(--muted);font-size:16px}
.growth{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;position:relative}
.gstep{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.gstep b{font-family:var(--display);font-size:20px}
.gstep span:last-child{font-size:15px;color:var(--muted)}
.gstep.now{border:2px solid var(--onair);background:var(--onair-soft)}
.gstep.end{border:2px solid var(--green);background:var(--green-soft)}
@media (max-width:900px){.growth{grid-template-columns:repeat(2,minmax(0,1fr))}}
.side{display:flex;flex-direction:column;gap:8px;position:sticky;top:84px}
select{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);width:100%}
#segPrompt{min-height:220px;font:14px/1.5 var(--mono)}
.follow{display:grid;gap:8px}
.fchip{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px}
.fchip small{font:700 12px/1 var(--mono);color:var(--green);white-space:nowrap}
.fchip:hover{border-color:var(--ink)}
@media (max-width:900px){.side,.tally{position:static}}
.def.warn{border-color:var(--onair);background:var(--onair-soft)}
.def.warn p{font-size:clamp(19px,2.2vw,24px)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:700;z-index:20;max-width:calc(100% - 32px)}

/* chapter 4 */
.chat{display:flex;flex-direction:column;gap:10px;min-height:360px}
.msgs{flex:1;display:flex;flex-direction:column;gap:8px;overflow-y:auto;max-height:380px;padding:4px}
.msg{max-width:85%;padding:10px 14px;border-radius:14px;font-size:17px}
.msg.bot{background:var(--paper);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.bot.fail{border-color:var(--onair);background:var(--onair-soft)}
.msg.me{background:var(--green);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);width:100%;min-width:0}
#botForm{flex-wrap:nowrap}
.score{font-family:var(--mono);font-weight:700}
.recipe{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.ing textarea{min-height:0;margin-top:0;font-size:16px}
.ing{display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.prompt.small{font-size:13px;max-height:260px;overflow:auto}
.checklist.compact label{padding:10px 12px}
.checklist.compact b{font-size:16px;font-family:var(--body)}
.checklist.compact label::before{font-size:12px;padding:4px 6px}

/* chapter 5 */
.shot{width:100%;height:auto;border-radius:10px;margin-top:10px;display:block}
canvas#noise{width:100%;max-width:360px;height:auto;border-radius:10px;display:block;margin-top:10px;image-rendering:pixelated}
.how-list{margin:0;padding-left:22px;display:grid;gap:12px;font-size:19px}
.g5{grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.tabs{display:flex;gap:6px;margin:10px 0 2px;flex-wrap:wrap}
.tab{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:15px;font-weight:700}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.stat b{display:block;font-family:var(--display);font-size:clamp(34px,4vw,48px);line-height:1.1;margin:4px 0 8px;font-variant-numeric:tabular-nums}

main{padding-block:24px 60px}
.who{margin-left:auto;display:flex;align-items:center;gap:10px}.me{font-weight:700}
a.ghost{text-decoration:none;color:var(--ink)}
input,select,textarea{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);width:100%;min-width:0}
textarea{resize:vertical}
.form{display:grid;gap:10px}
.fb{padding:10px 12px;border-radius:10px}.fb.no{background:var(--onair-soft);color:var(--ink)}
.login{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;margin-top:20px;align-items:stretch}
.hero{background:#13221C;color:#fff;border-radius:20px;padding:30px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.hero h1{font-size:clamp(34px,5vw,54px);font-weight:800}.hero h1 span{color:#4BC38B}.hero p{font-size:19px;margin:0;max-width:40ch;color:#DDE7E1}
@media (max-width:800px){.login{grid-template-columns:1fr}}
.narrow{max-width:520px;margin:30px auto 0}
.welcome{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;align-items:end;margin-bottom:20px}
.welcome h1{font-size:clamp(34px,5vw,52px);font-weight:800;margin:6px 0}
@media (max-width:800px){.welcome{grid-template-columns:1fr}}
.total b{display:block;font:800 52px/1 var(--display);margin:6px 0 10px;font-variant-numeric:tabular-nums}
.total .btn{display:inline-block;margin-top:14px;text-decoration:none}
.bar{display:block;height:10px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green);border-radius:6px}
.bar.sm{height:6px;margin-top:6px;max-width:360px}
.chapters{display:grid;gap:10px}
.ch{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 18px;color:inherit;text-decoration:none}
.ch:hover{border-color:var(--green)}
.ch .num{font:800 26px/1 var(--display);width:50px;height:50px;border-radius:12px;background:var(--paper);border:2px solid var(--green);color:var(--green);display:grid;place-items:center}
.ch.done .num{background:var(--green);color:#fff}
.ch .body{display:flex;flex-direction:column;gap:2px;min-width:0}.ch .body b{font-family:var(--display);font-size:22px}.ch .learn{font-size:16px;color:var(--muted)}
.ch .pct{font:700 18px/1 var(--mono);color:var(--muted)}
.extra{display:flex;flex-direction:column;gap:4px;margin-top:16px;text-decoration:none;color:inherit;border-style:dashed}.extra b{font-family:var(--display);font-size:22px}
.lcards{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));margin-top:10px}
.lcard{border:2px dashed var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:3px}.lcard small{color:var(--muted);overflow-wrap:anywhere}
.tbl{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:top}
th{font:700 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.ok{background:var(--green-soft);font-weight:700;text-align:center}td.part{background:var(--gold-soft);text-align:center}
.work{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));white-space:normal;padding:8px 0}
.wk{background:var(--paper);border-radius:10px;padding:10px}.wk p{margin:4px 0 0;white-space:pre-wrap;font-size:15px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:700;z-index:20;max-width:calc(100% - 32px)}
.folders{display:grid;gap:12px;margin-top:10px}.fold{border:1px solid var(--line);border-radius:12px;padding:12px}.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.th{display:flex;flex-direction:column;align-items:center;gap:2px;width:86px;text-decoration:none;color:inherit}.th img,.th span{width:86px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:26px;background:var(--paper)}.th small{font:12px var(--mono);color:var(--muted)}
</style>
<script src="config.js"></script>
</head><body>
<header class="top">
  <div class="wrap">
    <div class="bug"><span class="live"><i></i>LIVE</span><span>AI Creators <small>· EB7 course</small></span></div>
    <div class="who" id="who"></div>
  </div>
</header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script>
(function(){
const $ = s => document.querySelector(s);
const el = (t, a, ...k) => { const e = document.createElement(t); if (a) for (const n in a){ if (n.startsWith("on")) e.addEventListener(n.slice(2), a[n]); else if (n === "class") e.className = a[n]; else if (a[n] != null) e.setAttribute(n, a[n]); } k.flat().forEach(c => { if (c != null && c !== false) e.append(c); }); return e; };
const C = window.EVG_CLOUD || {}, ON = !!(C.url && C.key), SESS = "ai-lab-session", RX = /^(ch[1-9]-|meet-ai-)/, TKEY = "evg-teacher";
let ACC = null; try { ACC = ON ? JSON.parse(localStorage.getItem(SESS) || "null") : null; } catch(e) {}
let tt; function toast(m){ const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2600); }

async function rpc(fn, args){
  let r; try { r = await fetch(C.url.replace(/\/+$/,"") + "/rest/v1/rpc/" + fn, {method:"POST", headers: Object.assign({"apikey":C.key, "Content-Type":"application/json"}, /^eyJ/.test(C.key) ? {"Authorization":"Bearer " + C.key} : {}), body: JSON.stringify(args || {})}); }
  catch(e){ throw {code:"offline"}; }
  const t = await r.text(); let j = null; try { j = t ? JSON.parse(t) : null; } catch(e) {}
  if (!r.ok) throw {code: (j && j.message) || ("http_" + r.status)}; return j;
}
const ERR = c => ({wrong_login:"Wrong username or password. Check with your teacher.", too_many_tries:"Too many tries. Wait 10 minutes, then try again.", offline:"No internet connection. Check the Wi-Fi and try again.", teacher_exists:"A teacher account already exists. Log in instead.", too_short:"Username needs 3+ letters and password 6+ characters.", not_teacher:"Your teacher session ended. Log in again."})[c] || "Something went wrong (" + c + "). Try again.";

/* ---------- course data in this browser ---------- */
const CH = [
  {n:1, t:"Meet AI", s:"1", f:"ch1.html", learn:"What AI is, how it learns. Pick your team and your part", lists:[], extra: d => (d["meet-ai-idea"] ? 1 : 0) + (pj(d["ch1-part"]) ? 1 : 0), of:2},
  {n:2, t:"AI Training", s:"2–3", f:"ch2.html", learn:"Teach a real AI: school objects or a recycling robot", lists:[["ch2-list1",8],["ch2-list2",6],["ch2-list3",6]]},
  {n:3, t:"Prompt Engineering", s:"4", f:"ch3.html", learn:"Design your part with Gemini: your design card", lists:[["ch3-list1",7]]},
  {n:4, t:"AI Storytelling", s:"5", f:"ch4.html", learn:"A story from the future, with your own character", lists:[["ch4-list1",6],["ch4-hunt",5]]},
